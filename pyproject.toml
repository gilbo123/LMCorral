[project]
name = "lmcorral"
version = "0.1.1"
description = "Break your language models on purpose, and stop them when they bolt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/gilbo123/LMCorral"
Repository = "https://github.com/gilbo123/LMCorral"
Issues = "https://github.com/gilbo123/LMCorral/issues"
Documentation = "https://github.com/gilbo123/LMCorral#readme"
Changelog = "https://github.com/gilbo123/LMCorral/releases"

[project.scripts]
lmcorral = "lmcorral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lmcorral"]

[tool.hatch.build.targets.wheel.force-include]
"lmcorral/assets" = "lmcorral/assets"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
