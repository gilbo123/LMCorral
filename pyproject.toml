[project]
name = "lmcorral"
version = "0.1.0"
description = "Break your language models on purpose, and stop them when they bolt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
lmcorral = "lmcorral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lmcorral"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
