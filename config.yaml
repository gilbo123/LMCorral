# Edit target.url and target.model, then run:  lmcorral run
# Optional CLI flags (--probe, --docx) override non-target settings only.
# ${VAR} is replaced from your environment (use for API keys, not literals).

target:
  # --- Ollama (native API) ---
  # local url
  url: http://127.0.0.1:11434
  # server url
  # url: http://192.168.1.200:11434
  model: "qwen3.6:latest"

  # --- OpenAI (OpenAI-compatible /v1 client) ---
  # url: https://api.openai.com/v1
  # model: "gpt-4o"                # must match an id from: curl -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models
  # api_key: "${OPENAI_API_KEY}"   # export OPENAI_API_KEY in your shell — never put the key in this file
  
  # --- vLLM (OpenAI-compatible /v1 client) ---
  # local url
  # url: http://127.0.0.1:8000
  # server url
  # url: https://api.vllm.ai/v1
  # model: "gpt-4o-mini"
  # api_key: "${VLLM_API_KEY}"

  connect_timeout_seconds: 5.0
  read_timeout_seconds: 120.0

limits:
  token_budget: 600              # max stream chunks before cut-off
  wall_clock_seconds: 45.0       # max seconds per generation
  token_gap_seconds: 20.0        # max silence between chunks
  max_tokens: 700                # max answer length for bounded probes
  temperature: 0.7
  repetition_min_period: 3
  repetition_max_period: 220
  repetition_cycles: 4
  repetition_line_repeats: 8
  repetition_check_every: 16

report:
  jsonl: lmcorral-report.jsonl
  docx: null                     # e.g. report.docx
  max_transcript_chars: 4000

probes: []                       # empty = run all; or list ids: [runaway, safety, leak]

probe_limits: {}                 # per-probe overrides, e.g. runaway.unbounded_output: {token_budget: 1200}

probe_dirs: []                   # folders of your own .py probes

# Optional HTTP sink when your agent runtime executes tool calls (SSRF confirmation).
# probe_server:
#   host: 127.0.0.1
#   port: 8765
#   path: /canary/ssrf

custom_probes: []                # probes without Python — see README

# Long-running scope probes can override limits per id, e.g.:
# probe_limits:
#   scope.feature_creep: {wall_clock_seconds: 120, max_turns: 8}
